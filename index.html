<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebPage一覧</title>
<style>
  :root {
    color-scheme: light dark;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    max-width: 900px;
    margin: 40px auto;
    padding: 0 16px;
    line-height: 1.6;
  }
  h1 {
    font-size: 1.5rem;
    margin-bottom: 0.5rem;
  }
  p.desc {
    color: #666;
    margin-top: 0;
    margin-bottom: 1.5rem;
  }
  table {
    width: 100%;
    border-collapse: collapse;
  }
  th, td {
    border: 1px solid #ccc;
    padding: 8px 12px;
    text-align: left;
    vertical-align: top;
  }
  th {
    background: #f2f2f2;
  }
  th:first-child, td:first-child {
    width: 4em;
    text-align: center;
  }
  a {
    color: #1a5fb4;
    text-decoration: none;
  }
  a:hover {
    text-decoration: underline;
  }
  @media (prefers-color-scheme: dark) {
    body { color: #eee; background: #1e1e1e; }
    p.desc { color: #aaa; }
    th { background: #2a2a2a; }
    th, td { border-color: #444; }
    a { color: #7aa9f0; }
  }
</style>
</head>
<body>
<h1>WebPage一覧</h1>
<p class="desc">これまでに作成したWebページの一覧です。サイト名をクリックすると別タブで開きます。</p>
<table>
  <thead>
    <tr>
      <th>No</th>
      <th>サイト名</th>
      <th>どういうページか</th>
    </tr>
  </thead>
  <tbody id="linkTable"></tbody>
</table>

<script src="links.js"></script>
<script>
  const tbody = document.getElementById("linkTable");
  links.forEach((link, i) => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${i + 1}</td>
      <td><a href="${link.url}" target="_blank" rel="noopener noreferrer">${link.name}</a></td>
      <td>${link.description}</td>
    `;
    tbody.appendChild(tr);
  });
</script>
</body>
</html>
